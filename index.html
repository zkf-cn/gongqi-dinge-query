<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建筑安装工程工期定额（2016）查询系统</title>
<style>
:root{
  --blue:#1e5fa8; --blue-l:#e8f1fb; --hdr:#99CCFF;
  --bd:#d4dbe4; --bg:#f4f6f9; --txt:#2b3440;
  --accent:#0b7a3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:13px;color:var(--txt);background:var(--bg);display:flex;flex-direction:column}
header.banner{flex:none;height:64px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:16px;padding:0 24px;white-space:nowrap;background:linear-gradient(90deg,#1e5fa8,#2f7fd0);color:#fff;box-shadow:0 2px 6px rgba(30,60,100,.2);margin:8px 8px 0;border-radius:8px}
header.banner .b-title{font-size:32px;font-weight:bold;letter-spacing:4px;text-shadow:0 0 6px rgba(255,255,255,.7),0 0 14px rgba(255,255,255,.4)}
header.banner .b-sub{font-size:13px;letter-spacing:1px;opacity:.92}
.app{display:grid;grid-template-columns:340px 6px 1fr;grid-template-rows:1fr;flex:1;min-height:0;padding:8px;gap:0}
.col-l{display:grid;grid-template-rows:1fr 6px minmax(180px,auto);min-width:0;min-height:0;height:100%}
.col-r{display:grid;grid-template-rows:auto 1fr 6px minmax(150px,30%);min-width:0;min-height:0}
.gutter-v{cursor:col-resize}
.gutter-h{cursor:row-resize}
.panel{background:#fff;border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:0 1px 3px rgba(30,60,100,.06)}
.panel-hd{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(#f9fbfe,#eef4fb);border-bottom:1px solid var(--bd);font-weight:bold;color:var(--blue);font-size:13px}
.panel-hd .sub{font-weight:normal;color:#8a94a3;font-size:11px;margin-left:auto}
.panel-bd{flex:1;overflow:auto;min-height:0}

/* ============ 左上：定额列表树 ============ */
.tree{padding:6px 4px 20px}
.tnode{user-select:none}
.tlabel{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;line-height:1.5}
.tlabel:hover{background:var(--blue-l)}
.tlabel.active{background:var(--blue);color:#fff}
.tlabel .caret{flex:none;width:12px;font-size:10px;color:#9aa6b5;transition:transform .15s}
.tlabel.open .caret{transform:rotate(90deg)}
.tlabel.leaf .caret{visibility:hidden}
.tlabel .ico{flex:none;font-size:11px}
.tlabel .tcount{color:#9aa6b5;font-size:11px;margin-left:2px;font-weight:normal}
.tchildren{margin-left:14px;border-left:1px dotted #ccd5e0;padding-left:4px;display:none}
.tchildren.show{display:block}

/* ============ 左下：说明 ============ */
.note-tabs{flex:none;display:flex;gap:4px;padding:6px 8px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:#fafcff}
.note-tab{padding:4px 10px;border:1px solid var(--bd);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;background:#eef1f6;color:#5a6675;font-size:12px;white-space:nowrap}
.note-tab.active{background:#fff;color:var(--blue);font-weight:bold;position:relative;top:1px}
.note-doc{padding:12px 16px;font-size:13px}
.note-doc h1{font-size:17px;text-align:center;margin:10px 0 14px;color:#222}
.note-doc h2{font-size:15px;text-align:center;margin:10px 0}
.note-doc h3{font-size:13px;text-align:center;font-weight:400}
.note-doc p{line-height:180%;text-indent:2em;margin:5px 0}
.note-doc p[align=center]{text-indent:0}
.note-doc table{border-collapse:collapse;max-width:100% !important;width:auto !important;margin:4px auto;table-layout:auto !important;word-break:break-all}
.note-doc table[border="1"] td{border:1px solid #444;padding:3px 5px;font-size:12px;line-height:150%}
.note-doc td{vertical-align:top}
.note-doc sub{font-size:10px}
.note-doc img{max-width:100%}

/* ============ 右上：查询组件 ============ */
.searchbar{padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.searchbar input[type=text]{flex:1;min-width:200px;padding:7px 12px;border:1px solid var(--bd);border-radius:6px;font-size:13px;outline:none}
.searchbar input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(30,95,168,.15)}
.searchbar select{padding:7px 8px;border:1px solid var(--bd);border-radius:6px;font-size:13px;background:#fff;outline:none;max-width:180px}
.btn{padding:7px 16px;border:none;border-radius:6px;background:var(--blue);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.green{background:var(--accent)}
.btn.sm{padding:2px 8px;font-size:12px;border-radius:4px}
.btn.danger{background:#c0392b}
.hint{width:100%;font-size:11px;color:#8a94a3}

/* ============ 右中：查询内容 ============ */
.results{padding:10px 12px 30px}
.group{margin-bottom:18px}
.group-title{font-weight:bold;color:var(--blue);padding:4px 2px;font-size:13px}
.group-title .crumb{color:#8a94a3;font-weight:normal;font-size:11px}
table.qt{border-collapse:collapse;width:100%;background:#fff}
table.qt th{background:var(--hdr);border:1px solid #6b9bd2;padding:5px 6px;font-size:12px;font-weight:600;color:#123}
table.qt td{border:1px solid #b9c9dd;padding:4px 6px;text-align:center;font-size:12.5px}
table.qt tr:hover td{background:#f0f6ff}
table.qt td.code{font-weight:bold;color:var(--blue);white-space:nowrap}
table.qt td.day{font-weight:bold;color:#b34700}
table.qt mark{background:#ffe28a;padding:0 1px}
table.qt tr.qt-note td{background:#fffbe6;color:#7a5d00;font-style:italic;text-align:left;padding:6px 8px;border-color:#e6d790}
table.qt tr.qt-note:hover td{background:#fff3cc}
.addbtn{width:26px;height:22px;border:1px solid var(--accent);background:#eafaf0;color:var(--accent);border-radius:4px;cursor:pointer;font-weight:bold;line-height:1}
.addbtn:hover{background:var(--accent);color:#fff}
.addbtn.added{background:#ccc;border-color:#bbb;color:#fff;cursor:default}
.empty{color:#9aa6b5;text-align:center;padding:40px 10px;font-size:13px}
.empty b{color:var(--blue)}

/* ============ 右下：统计列表 ============ */
.stats-wrap{display:flex;flex-direction:column;height:100%}
table.st{border-collapse:collapse;width:100%}
table.st th{background:#e9f5ee;border:1px solid #bcd9c8;padding:4px 6px;font-size:12px;color:#14532d;position:sticky;top:0}
table.st td{border:1px solid #d5e5db;padding:3px 6px;text-align:center;font-size:12.5px}
table.st td.code{font-weight:bold;color:var(--blue);white-space:nowrap}
table.st td.days{font-weight:bold;color:#b34700}
table.st select{padding:2px 4px;border:1px solid var(--bd);border-radius:4px;font-size:12px}
.st-del{border:none;background:none;color:#c0392b;cursor:pointer;font-size:14px}
.stats-foot{flex:none;display:flex;align-items:center;gap:12px;padding:6px 12px;border-top:1px solid var(--bd);background:#f2faf5;font-size:13px}
.stats-foot .total{margin-left:auto;font-size:14px}
.stats-foot .total b{color:#b34700;font-size:18px}
.gutter-h,.gutter-v{background:transparent}

/* ============ 左下：说明列表 ============ */
.note-list{list-style:none;padding:6px 4px}
.note-list li{padding:9px 12px;margin:4px 8px;border:1px solid var(--bd);border-radius:6px;cursor:pointer;background:#fafcff;font-size:13px;color:#34404f;display:flex;align-items:center;gap:8px;transition:all .15s}
.note-list li:hover{background:var(--blue-l);border-color:var(--blue);transform:translateX(2px)}
.note-list li .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.note-list li > span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-list li .go{margin-left:auto;color:#9aa6b5;font-size:12px;white-space:nowrap;flex:none}
/* ============ 说明弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(20,40,70,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px}
.modal-mask[hidden]{display:none}
.modal{background:#fff;border-radius:10px;width:min(820px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(20,40,70,.35);overflow:hidden}
.modal-hd{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,#1e5fa8,#2f7fd0);color:#fff;font-weight:bold;font-size:15px}
.modal-x{margin-left:auto;border:none;background:rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.modal-x:hover{background:rgba(255,255,255,.35)}
.modal-bd{flex:1;overflow:auto;padding:8px 10px}

/* ================= 移动端适配 ================= */
.mtabs{display:none;position:fixed;left:0;right:0;bottom:0;height:54px;background:#fff;border-top:1px solid var(--bd);box-shadow:0 -2px 10px rgba(20,40,70,.12);z-index:600;padding-bottom:env(safe-area-inset-bottom)}
.mtabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#5a6675;cursor:pointer;font-size:11px}
.mtabs button .ico{font-size:18px;line-height:1}
.mtabs button.active{color:var(--blue);font-weight:bold}
.mtabs button.active .ico{transform:scale(1.12)}

@media (max-width: 820px){
  html,body{height:auto;overflow:auto;-webkit-text-size-adjust:100%}
  header.banner{height:auto;flex-direction:column;gap:1px;padding:8px 10px;text-align:center;border-radius:8px}
  header.banner .b-title{font-size:19px;letter-spacing:2px}
  header.banner .b-sub{font-size:10.5px;letter-spacing:0}
  .app{display:block;height:auto;flex:none;padding:8px;padding-bottom:62px}
  .col-l,.col-r{display:block;height:auto;min-height:0}
  .gutter-h,.gutter-v{display:none}
  .panel{display:none !important;margin-bottom:8px;max-height:80vh}
  .app.m-tree  .panel[data-mview="tree"],
  .app.m-notes .panel[data-mview="notes"],
  .app.m-search .panel[data-mview="search"],
  .app.m-stats .panel[data-mview="stats"]{display:flex !important}
  .panel-bd{overflow:auto;-webkit-overflow-scrolling:touch}
  /* 表格横向滑动，避免压扁 */
  table.qt,table.st{min-width:540px;width:auto}
  .results{overflow-x:auto}
  /* 搜索栏：第1行搜索框，第2行下拉框+2按钮 */
  .searchbar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;align-items:center}
  .searchbar input[type=text]{flex:1 1 100%;width:100%;min-width:0;font-size:15px;padding:10px 12px}
  .searchbar select{flex:1 1 auto;min-width:130px;max-width:none;font-size:15px;padding:9px 8px}
  .searchbar .btn{flex:1 1 0;min-width:88px;padding:10px 0;font-size:15px}
  .hint{font-size:11px;line-height:1.5}
  /* 触摸目标放大 */
  .addbtn{width:32px;height:28px;font-size:15px}
  .st-del{font-size:18px;padding:4px 8px}
  table.st select{padding:5px 6px;font-size:14px}
  /* 底部标签栏显示 */
  .mtabs{display:flex}
  /* 弹窗在手机上更紧凑 */
  .modal{width:94vw;max-height:90vh}
  .modal-bd{padding:6px 8px}
  .note-doc{padding:8px 10px;font-size:14px}
}
</style>
</head>
<body>
<header class="banner"><span class="b-title">建筑安装工程工期定额查询系统</span><span class="b-sub">TY01-89-2016 · 2016年版 · 共<span id="bannerTotal">0</span>条定额</span></header>
<div class="app">
  <!-- 左列 -->
  <div class="col-l">
    <!-- 左上：定额列表 -->
    <div class="panel" data-mview="tree">
      <div class="panel-hd">📚 定额列表 <span class="sub" id="treeCount"></span></div>
      <div class="panel-bd"><div class="tree" id="tree"></div></div>
    </div>
    <div class="gutter-h"></div>
    <!-- 左下：相关说明 -->
    <div class="panel" data-mview="notes">
      <div class="panel-hd">📄 相关说明 <span class="sub">点击条目查看</span></div>
      <div class="panel-bd"><ul class="note-list" id="noteList"></ul></div>
    </div>
  </div>
  <div class="gutter-v"></div>
  <!-- 右列 -->
  <div class="col-r">
    <!-- 右上：查询组件 -->
    <div class="panel" style="margin-bottom:0" data-mview="search">
      <div class="panel-hd">🔍 查询定额</div>
      <div class="searchbar">
        <input type="text" id="q" placeholder="输入定额编号（如 1-15）或关键词（如 剪力墙 5000 / 地下室 2层），空格分隔多条件…">
        <select id="fPart"><option value="">全部部分</option></select>
        <button class="btn" id="btnSearch">查 询</button>
        <button class="btn ghost" id="btnReset">重置</button>
        <div class="hint">支持多关键词组合（空格=且）；输入编号可精确定位；点击左侧目录可浏览整表；点击行末 <b style="color:var(--accent)">＋</b> 将该条加入下方统计列表</div>
      </div>
    </div>
    <!-- 右中：查询内容 -->
    <div class="panel" style="border-top-left-radius:0;border-top-right-radius:0;border-top:none;margin-top:6px" data-mview="search">
      <div class="panel-hd">📋 查询内容 <span class="sub" id="resInfo"></span></div>
      <div class="panel-bd"><div class="results" id="results">
        <div class="empty">输入关键词查询，或从左侧<b>定额列表</b>选择章节浏览完整定额表</div>
      </div></div>
    </div>
    <div class="gutter-h"></div>
    <!-- 右下：统计列表 -->
    <div class="panel" data-mview="stats">
      <div class="panel-hd">🧮 统计列表 <span class="sub" id="stInfo"></span></div>
      <div class="panel-bd" id="statsBody"></div>
      <div class="stats-foot">
        <button class="btn sm danger" id="btnClear">清空</button>
        <button class="btn sm ghost" id="btnCsv">导出CSV</button>
        <span style="color:#5a6675;font-size:11px">每条可单独选择地区/土壤类别列</span>
        <span class="total">合计工期：<b id="totalDays">0</b> 天</span>
      </div>
    </div>
  </div>
</div>
<!-- 说明弹窗 -->
<div class="modal-mask" id="noteModal" hidden>
  <div class="modal">
    <div class="modal-hd"><span id="modalTitle"></span><button class="modal-x" id="modalX" title="关闭">✕</button></div>
    <div class="modal-bd"><div class="note-doc" id="modalDoc"></div></div>
  </div>
</div>

9","28","37","10"],["燃油（气）锅炉","散装","20t/h（或14MW）以内","25","35","45","15"]]}],"notes":{"root":{"title":"总说明","html":"<div align=\"center\">\r\n\t<table width=\"800\" border=\"0\">\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<h1>总说明</h1>\r\n\t\t\t<p>一、《建筑安装工程工期定额》（以下简称“本定额”）是在《全国统一建筑安装工程工期定额》（2000年）基础上，依据国家现行产品标准、设计规范、施工及验收规范、质量评定标准和技术、安全操作规程，按照正常施工条件、常用施工方法、合理劳动组织及平均施工技术装备程度和管理水平，并结合当前常见结构及规模建筑安装工程的施工情况编制的。</p>\r\n\t\t\t<p>二、本定额适用于新建和扩建的建筑安装工程。</p>\r\n\t\t\t<p>三、本定额是国有资金投资工程在可行性研究、初步设计、招标阶段确定工期的依据，非国有资金投资工程执行；是签订建筑安装工程施工合同的基础。</p>\r\n\t\t\t<p>四、本定额工期，是指从开工之日起，到完成各章、节所包含的全部工程内容并达到国家验收标准之日止的日历天数（包括法定节假日）；不包括三通一平、打试验桩、地下障碍物处理、基础施工前的降水和基坑支护时间、竣工文件编制所需的时间。</p>\r\n\t\t\t<p>五、本定额包括民用建筑工程、工业及其他建筑工程、构筑物工程及专业工程四部分。</p>\r\n\t\t\t<p>六、我国各地气候条件差别较大，以下省、市和自治区按其省会（首府）气候条件为基准划分为Ⅰ、Ⅱ、Ⅲ类地区，工期天数分别列项。</p>\r\n\t\t\t<p>Ⅰ类地区：上海、江苏、浙江、安徽、福建、江西、湖北、湖南、广东、广西、四川、贵州、云南、重庆、海南。</p>\r\n\t\t\t<p>Ⅱ类地区：北京、天津、河北、山西、山东、河南、陕西、甘肃、宁夏。</p>\r\n\t\t\t<p>Ⅲ类地区：内蒙、辽宁、吉林、黑龙江、西藏、青海、新疆。</p>\r\n\t\t\t<p>设备安装和机械施工工程执行本定额时不分地区类别。</p>\r\n\t\t\t<p>七、本定额综合考虑了冬雨期施工、一般气候影响、常规地质条件和节假日等因素。</p>\r\n\t\t\t<p>八、本定额已综合考虑预拌混凝土和现场搅拌混凝土、预拌砂浆和现场搅拌砂浆的施工因素。</p>\r\n\t\t\t<p>九、框架－剪力墙结构工期按照剪力墙结构工期计算。</p>\r\n\t\t\t<p>十、本定额的工期是按照合格产品标准编制的。</p>\r\n\t\t\t<p>工期压缩时，宜组织专家论证，且相应增加压缩工期增加费。</p>\r\n\t\t\t<p>十一、本定额施工工期的调整：</p>\r\n\t\t\t<p>（一）施工过程中，遇不可抗力、极端天气或政府政策性影响施工进度或暂停施工的，按照实际延误的工期顺延。</p>\r\n\t\t\t<p>（二）施工过程中发现实际地质情况与地质勘查报告出入较大的，应按照实际地质情况调整施工工期。</p>\r\n\t\t\t<p>（三）施工过程中遇到障碍物或古墓、文物、化石、流砂、溶洞、暗河、淤泥、石方、地下水等需要进行特殊处理且影响关键线路时，工期相应顺延。</p>\r\n\t\t\t<p>（四）合同履行过程中，因非承包人原因发生重大设计变更的，应调整工期。</p>\r\n\t\t\t<p>（五）其他非承包人原因造成的工期延误应予以顺延。</p>\r\n\t\t\t<p>十二、同期施工的群体工程中，一个承包人同时承包2个以上（含2个）单项（位）工程时，工期的计算：以一个最大工期的单项（位）工程为基数，另加其他单项工程工期总和乘以相应系数计算：加1个乘以系数0.35；加2个乘以系数0.2；加3个乘以系数0.15，加4个及以上的单项（位）工程不另增加工期。</p>\r\n\t\t\t<p>加1个单项（位）工程：T＝T<sub>1</sub>＋T<sub>2</sub>×0.35</p>\r\n\t\t\t<p>加2个单项（位）工程：T＝T<sub>1</sub>＋（T<sub>2</sub>＋T<sub>3</sub>）×0.2</p>\r\n\t\t\t<p>加3个单项（位）工程：T＝T<sub>1</sub>＋（T<sub>2</sub>＋T<sub>3</sub>＋T<sub>4</sub>）×0.15</p>\r\n\t\t\t<p>其中：T为工程总工期；T<sub>1</sub>、T<sub>2</sub>、T<sub>3</sub>、T<sub>4</sub>为所有单项（位）工程工期最大的前四个，且T<sub>1</sub>≥T<sub>2</sub>≥T<sub>3</sub>≥T<sub>4</sub>。</p>\r\n\t\t\t<p>十三、本定额建筑面积按照国家标准《建筑工程建筑面积计算规范》GB/T50353-2013计算；层数以建筑自然层数计算，设备管道层计算层数，出屋面的楼（电）梯间、水箱间不计算层数。</p>\r\n\t\t\t<p>十四、本定额子目中凡注明“××以内（下）”者，均包括“××”本身，“××以外（上）”者，则不包括“××”本身。</p>\r\n\t\t\t<p>十五、超出本定额范围的按照实际情况另行计算工期。</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</table>\r\n</div>"},"notice":{"title":"住房城乡建设部关于印发《建筑安装工程工期定额》的通知","html":"<div align=\"center\">\r\n\t<table width=\"800\" border=\"0\" style=\"table-layout: fixed; word-break: break-all\">\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<h1>住房城乡建设部关于印发《建筑安装工程工期定额》的通知</h1>\r\n\t\t\t<h2>建标〔2016〕161号</h2>\r\n\t\t\t<div style=\"width:100%;height:1px;margin:0px auto;padding:0px;background-color:#666;overflow:hidden;\"></div>\r\n\t\t\t<p style=\"text-indent: 0em\">　</p>\r\n\t\t\t<p style=\"text-indent: 0em\">各省、自治区住房城乡建设厅，直辖市建委，国务院有关部门：</p>\r\n\t\t\t<p>为满足科学合理确定建筑安装工程工期的需要，我部组织修编了《建筑安装工程工期定额》，现印发给你们，自2016年10月1日起执行。执行中遇到的问题和有关建议请及时反馈我部标准定额司。</p>\r\n\t\t\t<p>我部2000年发布的《全国统一建筑安装工程工期定额》同时废止。</p>\r\n\t\t\t<p>以上定额及规则由我部标准定额研究所组织中国计划出版社出版发行。</p>\r\n\t\t\t<p>　</p>\r\n\r\n\t\t\t<div style=\"text-align:right\">\r\n\t\t\t\t中华人民共和国住房和城乡建设部<p>2016年7月26日</div>\r\n\t\t\t</div>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</table>\r\n</div>"},"第一部分  民用建筑工程":{"title":"第一部分  民用建筑工程 · 说明","html":"<div align=\"center\">\r\n\t<table width=\"800\" border=\"0\">\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<h1>说明</h1>\r\n\t\t\t<p>一、本部分包括民用建筑±0.000以下工程、±0.000以上工程、±0.000以上钢结构工程和±0.000以上超高层建筑四部分。</p>\r\n\t\t\t<p>二、±0.000以下工程划分为无地下室和有地下室两部分。无地下室项目按基础类型及首层建筑面积划分；有地下室项目按地下室层数（层）、地下室建筑面积划分。其工期包括±0.000以下全部工程内容，但不含桩基工程。</p>\r\n\t\t\t<p>三、±0.000以上工程按工程用途、结构类型、层数（层）及建筑面积划分。其工期包括±0.000以上结构、装修、设备安装全部工程内容。</p>\r\n\t\t\t<p>四、本部分装饰装修是按一般装修标准考虑的，低于一般装修标准按照相应工期乘以0.95；中级装修按照相应工期乘以系数1.05；高级装修按照相应工期乘以系数1.20计算。一般装修、中级装修、高级装修的划分标准如下：</p>\r\n\t\t\t<p align=\"center\" style=\"text-indent: 0em\"><b>装修标准划分表</b></p>\r\n\t\t\t<div align=\"center\">\r\n\t\t\t\t<table border=\"1\" cellspacing=\"0\" width=\"780\" bordercolor=\"#000000\" cellpadding=\"1\" style=\"border-collapse: collapse\" align=center>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\" width=\"100\">项目</td>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\" width=\"150\">一般</td>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\" width=\"200\">中级</td>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">高级</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">内墙面</td>\r\n\t\t\t\t\t\t<td class=\"bg\">一般涂料</td>\r\n\t\t\t\t\t\t<td class=\"bg\">贴面砖、高级涂料、贴墙纸、镶贴大理石、木墙裙</td>\r\n\t\t\t\t\t\t<td class=\"bg\">\r\n\t\t\t\t\t\t干挂石材、铝合金条板、镶贴石材、乳胶漆三遍及以上、贴壁纸、锦缎软包、镶板墙面、金属装饰板、造形木墙裙</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">外墙面</td>\r\n\t\t\t\t\t\t<td class=\"bg\">勾缝、水刷石、干粘石、一般涂料</td>\r\n\t\t\t\t\t\t<td class=\"bg\">贴面砖、高级涂料、镶贴石材、干挂石材</td>\r\n\t\t\t\t\t\t<td class=\"bg\">干挂石材、铝合金条板、镶贴石材、弹性涂料、真石漆、幕墙、金属装饰板</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">天棚</td>\r\n\t\t\t\t\t\t<td class=\"bg\">一般涂料</td>\r\n\t\t\t\t\t\t<td class=\"bg\">高级涂料、吊顶、壁纸</td>\r\n\t\t\t\t\t\t<td class=\"bg\">高级涂料、造形吊顶、金属吊顶、壁纸</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">楼地面</td>\r\n\t\t\t\t\t\t<td class=\"bg\">水泥、混凝土、塑料、涂料、块料地面</td>\r\n\t\t\t\t\t\t<td class=\"bg\">块料、木地板、地毯楼地面</td>\r\n\t\t\t\t\t\t<td class=\"bg\">大理石、花岗岩、木地板、地毯楼地面</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">门、窗</td>\r\n\t\t\t\t\t\t<td class=\"bg\">塑钢窗、钢木门（窗）</td>\r\n\t\t\t\t\t\t<td class=\"bg\">彩板、塑钢、铝合金、普通木门（窗）</td>\r\n\t\t\t\t\t\t<td class=\"bg\">彩板、塑钢、铝合金、硬木、不锈钢门（窗）</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t</table>\r\n\t\t\t</div>\r\n\t\t\t<p>注：1、高级装修：内外墙面、楼地面每项分别满足3个及3个以上高级装修项目，天棚、门窗每项分别满足2个及2个以上高级装修项目，并且每项装修项目的面积之和占相应装修项目面积70%以上者；</p>\r\n\t\t\t<p>2、中级装修：内外墙面、楼地面、天棚、门窗每项分别满足2个及2个以上中级装修项目；并且每项装修项目的面积之和占相应装修项目面积70%以上者。</p>\r\n\t\t\t<p>五、有关规定：</p>\r\n\t\t\t<p>1、±0.000以下工程工期：无地下室按首层建筑面积计算，有地下室按地下室建筑面积总和计算。</p>\r\n\t\t\t<p>2、±0.000以上工程工期：按±0.000以上部分建筑面积总和计算。</p>\r\n\t\t\t<p>3、总工期：±0.000以下工程工期与±0.000以上工程工期之和。</p>\r\n\t\t\t<p>4、单项工程±0.000以下由2种或2种以上类型组成时，按不同类型部分的面积查出相应工期，相加计算。</p>\r\n\t\t\t<p>5、单项工程±0.000以上结构相同，使用功能不同。无变形缝时，按使用功能占建筑面积比重大的计算工期；有变形缝时，先按不同使用功能的面积查出相应工期，再以其中一个最大工期为基数，另加其他部分工期的25%计算。</p>\r\n\t\t\t<p>6、单项工程±0.000以上由2种或2种以上结构组成。无变形缝时，先按全部面积查出不同结构的相应工期，再按不同结构各自的建筑面积加权平均计算；有变形缝时，先按不同结构各自的面积查出相应工期，再以其中一个最大工期为基数，另加其他部分工期的25%计算。</p>\r\n\t\t\t<p>7、单项工程±0.000以上层数（层）不同，有变形缝时，先按不同层数（层）各自的面积查出相应工期，再以其中一个最大工期为基数，另加其他部分工期的25%计算。</p>\r\n\t\t\t<p>8、单项工程中±0.000以上分成若干个独立部分时，参照总说明第十二条，同期施工的群体工程计算工期。如果±0.000以上有整体部分，将其并入工期最大的的单项（位）工程中计算。</p>\r\n\t\t\t<p>9、本定额工业化建筑中的装配式混凝土结构施工工期仅计算现场安装阶段，工期按照装配率50%编制。装配率40%、60%、70%按本定额相应工期分别乘以1.05、0.95、0.90计算。</p>\r\n\t\t\t<p>10、钢－混凝土组合结构的工期，参照相应项目的工期乘以系数1.10计算。</p>\r\n\t\t\t<p>11、±0.000以上超高层建筑单层平均面积按主塔楼±0.000以上总建筑面积除以地上总层数计算。</p>\t\t\t</td>\r\n\t\t</tr>\r\n\t</table>\r\n</div>"},"第二部分  工业及其他建筑工程":{"title":"第二部分  工业及其他建筑工程 · 说明","html":"<div align=\"center\">\r\n\t<table width=\"800\" border=\"0\">\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<h1>说明</h1>\r\n\t\t\t<p>一、本部分包括单层厂房、多层厂房、仓库、降压站、冷冻机房、冷库、冷藏间、空压机房、变电室、开闭所、锅炉房、服务用房、汽车库、独立地下工程、室外停车场、园林庭院工程。</p>\r\n\t\t\t<p>二、本部分所列的工期不含地下室工期，地下室工期执行±0000以下工程相应项目乘以系数0.70。</p>\r\n\t\t\t<p>三、工业及其他建筑工程施工内容包括基础、结构、装修和设备安装等全部工程内容。</p>\r\n\t\t\t<p>四、本部分厂房指机加工、装配、五金、一般纺织（粗纺、制条、洗毛等）、电子、服装及无特殊要求的装配车间。</p>\r\n\t\t\t<p>五、冷库工程不适用于山洞冷库、地下冷库和装配式冷库工程。</p>\r\n\t\t\t<p>六、单层厂房的主跨高度以9m内为准，高度在9m以上时，每增加2m增加工期10天，不足2m者，不增加工期。</p>\r\n\t\t\t<p>多层厂房层高在4.5m以上时，每增1m增加工期5天，不足1m者，不增加工期，每层单独计取后累加。</p>\r\n\t\t\t<p>厂房主跨高度指自室外地坪至檐口的高度。</p>\r\n\t\t\t<p>七、单层厂房的设备基础体积超过100m&sup3;时，另增加工期10天；体积超过500m&sup3;，另增加工期15天；体积超过1000m&sup3;时，另增加工期20天。带钢筋混凝土隔振沟的设备基础，隔振沟长度超过100m时，另增加工期10天，超过200m时，另增加工期15天，超过500m时，另增加工期20天。</p>\r\n\t\t\t<p>八、带站台的仓库（不含冷库工程），其工期按本定额中仓库相应子目项乘以系数1.15计算。</p>\r\n\t\t\t<p>九、园林庭院工程的面积按占地面积计算（包括一般园林、喷水池、花池、葡萄架、石椅、石凳等庭院道路、园林绿化等）。</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</table>\r\n</div>"},"第三部分  构筑物工程":{"title":"第三部分  构筑物工程 · 说明","html":"<div align=\"center\">\r\n\t<table width=\"800\" border=\"0\">\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<h1>说明</h1>\r\n\t\t\t<p>一、本部分包括烟囱、水塔、钢筋混凝土贮水池、钢筋混凝土污水池、滑膜筒仓、冷却塔等工程。</p>\r\n\t\t\t<p>二、烟囱工程工期是按照钢筋混凝土结构考虑的，如采用砖砌体结构工程，其工期按相应高度钢筋混凝土烟囱工期定额乘系数0.8。</p>\r\n\t\t\t<p>三、水塔工程按照不保温结构考虑的，如增加保温内容，工期应增加10天。</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</table>\r\n</div>"},"第四部分  专业工程":{"title":"第四部分  专业工程 · 说明","html":"<div align=\"center\">\r\n\t<table width=\"800\" border=\"0\">\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<h1>说明</h1>\r\n\t\t\t<p>一、本部分包括机械土方工程、桩基工程、装饰装修工程、设备安装工程、机械吊装工程、钢结构工程。</p>\r\n\t\t\t<p>二、机械土方工程工期按不同挖深、土方量列项，包含土方开挖和运输。除基础采用逆作法施工的工期由甲、乙双方协商确定外，实际采用不同机械和施工方法时，不做调整。开工日期从破土开挖起开始计算，不包括开工前的准备工作时间。</p>\r\n\t\t\t<p>三、桩基工程工期依据不同土的类别条件编制，土的分类参照《房屋建筑与装饰工程工程量计算规范》GB 50854—2013，见下表。</p>\r\n\t\t\t<p align=\"center\" style=\"text-indent: 0em\"><b>土的分类表</b></p>\r\n\t\t\t<div align=\"center\">\r\n\t\t\t\t<table border=\"1\" cellspacing=\"0\" width=\"780\" bordercolor=\"#000000\" cellpadding=\"1\" style=\"border-collapse: collapse\" align=center>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\" width=\"200\">土的分类</td>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">土的名称</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">Ⅰ、Ⅱ类土</td>\r\n\t\t\t\t\t\t<td class=\"bg\">\r\n\t\t\t\t\t\t粉土、砂土（粉砂、细砂、中砂、粗砂、砾砂）、粉质黏土、弱中盐渍土、软土（淤泥质土、泥炭、泥炭质土）、软塑红黏土、冲填土</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">Ⅲ类土</td>\r\n\t\t\t\t\t\t<td class=\"bg\">\r\n\t\t\t\t\t\t黏土、碎石土（圆砾、角砾）、混合土、可塑红黏土、硬塑红黏土、强盐渍土、素填土、压实填土</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t\t<tr>\r\n\t\t\t\t\t\t<td class=\"bg\" align=\"center\">Ⅳ类土</td>\r\n\t\t\t\t\t\t<td class=\"bg\">碎石土（卵石、碎石、漂石、块石）、坚硬红黏土、超盐渍土、杂填土</td>\r\n\t\t\t\t\t</tr>\r\n\t\t\t\t</table>\r\n\t\t\t</div>\r\n\t\t\t<p>注：1、冲孔桩、钻孔桩穿岩层或入岩层时应适当增加工期。</p>\r\n\t\t\t<p>2、钻孔扩底灌注桩按同条件钻孔灌注桩工期乘以系数1.10计算。</p>\r\n\t\t\t<p>3、同一工程采用不同成孔方式同时施工时，各自计算工期取最大值。</p>\r\n\t\t\t<p>打桩开工日期以打第一根桩开始计算，包括桩的现场搬运、就位、打桩、压桩、接桩、送桩和钢筋笼制作安装等工作内容；不包括施工准备、机械进场、试桩、检验检测时间。</p>\r\n\t\t\t<p>预制混凝土桩的工期不区分施工工艺。</p>\r\n\t\t\t<p>四、装修工程按照装饰装修空间划分为室内装饰装修工程和外墙装饰装修工程。</p>\r\n\t\t\t<p>住宅、其他公共建筑及科技厂房工程按照设计使用年限、功能用途、材料设备选用、装饰工艺、环境舒适度划分为三个等级，分别为一般装修、中级装修和高级装修，等级标准详见第一部分装修标准划分表。宾馆（饭店）装饰装修工程装修标准按《中华人民共和国星级酒店评定标准》确定。装饰装修工程不包括超高层。</p>\r\n\t\t\t<p>对原建筑室内、外墙装饰装修有拆除要求的室内、外墙改造或改建的装饰装修工程，拆除原装饰装修层及垃圾外运工期另行计算。</p>\r\n\t\t\t<p>（一）室内装饰装修工程工期说明：</p>\r\n\t\t\t<p>1. 室内装饰装修工程内容包括：建筑物内空间范围的楼地面、天棚、墙柱面、门窗、室内隔断、厨房及厨具、卫生间及洁具、室内绿化等以及与室内装饰装修工程有关及相应项目。</p>\r\n\t\t\t<p>2. 室内装饰装修工程工期中所指建筑面积是指装饰装修施工部分范围空间内的建筑面积。</p>\r\n\t\t\t<p>3. 室内装饰装修工程已综合考虑建筑物的地上、地下部分和楼层层数对施工工期的影响。</p>\r\n\t\t\t<p>4. 室内装饰装修工程按使用功能用途分为以下三类计算工期：</p>\r\n\t\t\t<p>（1）住宅装饰装修工程：包括住宅、公寓等建筑物室内装饰装修工程；</p>\r\n\t\t\t<p>（2）宾馆、酒店、饭店装饰装修工程：包括宾馆、酒店、饭店、旅馆、酒吧、餐厅、会所、娱乐场所等建筑物的室内装饰装修工程；</p>\r\n\t\t\t<p>（3）公共建筑装饰装修工程：包括办公楼、写字楼、商场、学校、幼儿园、养老院、影剧院、体育馆、展览馆、机场航站楼、火车站、汽车站等建筑物的室内装饰装修工程。</p>\r\n\t\t\t<p>（二）外墙装饰装修工程工期说明：</p>\r\n\t\t\t<p>1. 外墙装饰装修工程的内容包括：外墙抹灰、外墙保温层、涂料、油漆、面砖、石材、幕墙、门窗、门楼雨篷、广告招牌、装饰造型、照明电气等外墙装饰装修形式。</p>\r\n\t\t\t<p>2. 外墙装饰装修工程工期中所指外墙装饰装修高度是指室外地坪至外墙装饰装修最高点的垂直高度，外墙装饰装修面积是指进行装饰装修施工的外墙展开面积。</p>\r\n\t\t\t<p>3. 外墙装饰装修工程是按一般装修编制的，中级装修按照相应工期乘以系数1.20计算；高级装修按照相应工期乘以系数1.40计算。</p>\r\n\t\t\t<p>五、设备安装工程包括变电室、开闭所、降压站、发电机房、空压站、消防自动报警系统安装、消防灭火系统、锅炉房、热力站、通风空调系统、冷冻机房、冷库、冷藏间、起重机和金属容器安装工程。工期计算从专业安装工程具备连续施工条件起，至完成承担的全部设计内容的日历天数。设备安装工程中的给水排水、电气、弱电及预留、预埋工程已综合考虑在建筑工程总工期中，不再单独列项。本工期不包括室外工程、主要设备订货和第三方有偿检测的工程内容。</p>\r\n\t\t\t<p>六、机械吊装工程包括构件吊装工程和网架吊装工程。构件吊装工程包括梁、柱、板、屋架、天窗架、支撑、楼梯、阳台等构件的现场搬运、就位、拼装、吊装、焊接等（后张法不包括开工前的准备工作、钢筋张拉和孔道灌浆）。网架吊装工程包括就位、拼装、焊接、架子搭设、安装等，不包括下料、喷漆。工期计算已综合考虑各种施工工艺，实际使用不做调整。</p>\r\n\t\t\t<p>七、钢结构安装工程工期是指钢结构现场拼装和安装、油漆等施工工期，不包括建筑的现浇混凝土结构和其他专业工程如装修、设备安装等的施工工期，不包括钢结构深化设计、构件制作工期。</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</table>\r\n</div>"}}};</script>
<script>/* 建筑安装工程工期定额（2016）查询系统 */
(function () {
  'use strict';
  const D = window.QDATA;
  const pagesById = {};
  D.pages.forEach(p => pagesById[p.id] = p);

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- 工期列识别 ---------- */
  const isDayCol = h => /^[ⅠⅡⅢⅣ、]+类土?$/.test(h) || h.startsWith('工期') || h.includes('加工期');
  function dayCols(page) {
    const idx = [];
    page.headers.forEach((h, i) => { if (isDayCol(h)) idx.push(i); });
    return idx;
  }

  /* 统计某节点（含其下所有页面）的定额条目总数 */
  function countItems(node) {
    if (node.type === 'page') {
      const p = pagesById[node.pageId];
      return p ? p.items.length : 0;
    }
    if (node.type === 'dir') {
      return (node.children || []).reduce((s, c) => s + countItems(c), 0);
    }
    return 0;
  }

  /* ================= 左上：定额列表树 ================= */
  const treeEl = $('#tree');
  let activeLabel = null;

  function buildTree(nodes, container, depth, partName) {
    nodes.forEach(node => {
      const wrap = document.createElement('div');
      wrap.className = 'tnode';
      const label = document.createElement('div');
      label.className = 'tlabel';
      const part = depth === 0 ? node.name : partName;

      if (node.type === 'dir') {
        const cnt = countItems(node);
        label.innerHTML = `<span class="caret">▶</span><span class="ico">📁</span><span>${esc(node.name)}</span><span class="tcount">（${cnt}）</span>`;
        const kids = document.createElement('div');
        kids.className = 'tchildren';
        wrap.appendChild(label);
        wrap.appendChild(kids);
        buildTree(node.children, kids, depth + 1, part);
        label.onclick = () => {
          label.classList.toggle('open');
          kids.classList.toggle('show');
        };
      } else if (node.type === 'page') {
        label.classList.add('leaf');
        const cnt = countItems(node);
        label.innerHTML = `<span class="caret"></span><span class="ico">📑</span><span>${esc(node.name)}</span><span class="tcount">（${cnt}）</span>`;
        label.onclick = () => {
          setActive(label);
          renderPage(node.pageId);
        };
        wrap.appendChild(label);
      } else { // note
        label.classList.add('leaf');
        label.innerHTML = `<span class="caret"></span><span class="ico">📄</span><span>${esc(node.name)}</span>`;
        label.onclick = () => { setActive(label); openNoteModal(node.noteKey); };
        wrap.appendChild(label);
      }
      container.appendChild(wrap);
    });
  }
  function setActive(el) {
    if (activeLabel) activeLabel.classList.remove('active');
    activeLabel = el; el.classList.add('active');
  }
  buildTree(D.tree, treeEl, 0, '');
  const totalItems = D.pages.reduce((s, p) => s + p.items.length, 0);
  $('#treeCount').textContent = D.pages.length + ' 个定额表 / ' + totalItems + ' 条定额';
  const bannerTotal = document.querySelector('#bannerTotal');
  if (bannerTotal) bannerTotal.textContent = totalItems;
  // 默认展开第一部分
  const first = treeEl.querySelector('.tlabel');
  if (first) first.click();

  /* ================= 左下：相关说明（列表 + 弹窗） ================= */
  const noteListEl = $('#noteList');
  const modalMask = $('#noteModal');
  const modalDoc = $('#modalDoc');
  const modalTitle = $('#modalTitle');
  const noteOrder = ['notice', 'root'].concat(Object.keys(D.notes).filter(k => k !== 'root' && k !== 'notice'));
  const itemName = k => k === 'root' ? '总说明'
    : k === 'notice' ? '住房城乡建设部关于印发《建筑安装工程工期定额》的通知'
    : k.replace(/第(.)部分\s*/, '第$1部分·').replace(/\s+/g, '') + '说明';

  noteOrder.forEach(k => {
    if (!D.notes[k]) return;
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot"></span><span>${esc(itemName(k))}</span><span class="go">查看 ›</span>`;
    li.onclick = () => openNoteModal(k);
    noteListEl.appendChild(li);
  });
  function openNoteModal(key) {
    if (!D.notes[key]) return;
    modalTitle.textContent = itemName(key);
    modalDoc.innerHTML = D.notes[key].html;
    modalDoc.parentElement.scrollTop = 0;
    modalMask.hidden = false;
  }
  function closeNoteModal() { modalMask.hidden = true; }
  modalMask.addEventListener('click', e => { if (e.target === modalMask) closeNoteModal(); });
  $('#modalX').onclick = closeNoteModal;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNoteModal(); });

  /* ================= 右上：查询组件 ================= */
  const partSel = $('#fPart');
  D.tree.forEach(n => {
    const o = document.createElement('option');
    o.value = n.name; o.textContent = n.name.replace(/\s+/g, ' ');
    partSel.appendChild(o);
  });
  $('#btnSearch').onclick = doSearch;
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  $('#q').addEventListener('input', debounce(doSearch, 300));
  partSel.onchange = doSearch;
  $('#btnReset').onclick = () => { $('#q').value = ''; partSel.value = ''; $('#results').innerHTML = '<div class="empty">输入关键词查询，或从左侧<b>定额列表</b>选择章节浏览完整定额表</div>'; $('#resInfo').textContent = ''; };

  function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

  const MAX_ROWS = 500;
  function doSearch() {
    const q = $('#q').value.trim();
    const part = partSel.value;
    if (!q && !part) return;
    const terms = q.split(/\s+/).filter(Boolean).map(t => t.toLowerCase());
    const isCode = terms.length === 1 && /^\d+-\d+$/.test(terms[0]);
    const groups = [];
    let total = 0, shown = 0;

    for (const p of D.pages) {
      if (part && p.path[0] !== part) continue;
      const pageText = (p.path.join('/') + '/' + p.title).toLowerCase();
      const hits = [];
      for (let i = 0; i < p.items.length; i++) {
        const it = p.items[i];
        let ok;
        if (isCode) {
          ok = it[0] === terms[0];
        } else if (terms.length === 0) {
          ok = true; // 仅按部分筛选
        } else {
          const rowText = it.join('|').toLowerCase();
          ok = terms.every(t => rowText.includes(t) || pageText.includes(t));
        }
        if (ok) { total++; if (shown < MAX_ROWS) { hits.push(i); shown++; } }
      }
      if (hits.length) groups.push({ page: p, idxs: hits });
    }
    renderGroups(groups, terms.filter(t => !/^\d+-\d+$/.test(t) || true));
    $('#resInfo').textContent = total ? `命中 ${total} 条${total > MAX_ROWS ? '，仅显示前 ' + MAX_ROWS + ' 条' : ''}` : '无结果';
  }

  /* ================= 右中：查询内容 ================= */
  const resultsEl = $('#results');

  function hl(text, terms) {
    let s = esc(text);
    if (!terms || !terms.length) return s;
    terms.forEach(t => {
      if (!t) return;
      try {
        const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        s = s.replace(re, '<mark>$1</mark>');
      } catch (e) { /* ignore */ }
    });
    return s;
  }

  function tableHtml(page, idxs, terms) {
    const dcs = dayCols(page);
    let h = `<table class="qt"><thead><tr>`;
    page.headers.forEach(hd => h += `<th>${esc(hd)}</th>`);
    h += `<th style="width:34px">统计</th></tr></thead><tbody>`;
    idxs.forEach(i => {
      const it = page.items[i];
      h += '<tr>';
      it.forEach((v, ci) => {
        const cls = ci === 0 ? 'code' : (dcs.includes(ci) ? 'day' : '');
        h += `<td class="${cls}">${hl(v, terms)}</td>`;
      });
      const added = stats.some(s => s.pid === page.id && s.idx === i);
      h += `<td><button class="addbtn${added ? ' added' : ''}" data-pid="${page.id}" data-idx="${i}" title="加入统计列表">${added ? '✓' : '＋'}</button></td></tr>`;
    });
    h += '</tbody>';
    if (page.note) {
      h += `<tfoot><tr class="qt-note"><td colspan="${page.headers.length + 1}">📌 ${esc(page.note)}</td></tr></tfoot>`;
    }
    h += '</table>';
    return h;
  }

  function renderGroups(groups, terms) {
    if (!groups.length) {
      resultsEl.innerHTML = '<div class="empty">未找到匹配的定额条目，请调整关键词</div>';
      return;
    }
    let h = '';
    groups.forEach(g => {
      const crumb = g.page.path.slice(0, -1).join(' › ');
      h += `<div class="group"><div class="group-title">${esc(g.page.title)} <span class="crumb">（${esc(crumb)}）</span></div>${tableHtml(g.page, g.idxs, terms)}</div>`;
    });
    resultsEl.innerHTML = h;
    resultsEl.parentElement.scrollTop = 0;
  }

  function renderPage(pid) {
    const p = pagesById[pid];
    if (!p) return;
    const idxs = p.items.map((_, i) => i);
    const crumb = p.path.slice(0, -1).join(' › ');
    resultsEl.innerHTML = `<div class="group"><div class="group-title">${esc(p.title)} <span class="crumb">（${esc(crumb)}）</span></div>${tableHtml(p, idxs, [])}</div>`;
    $('#resInfo').textContent = `浏览整表：${p.items.length} 条`;
    resultsEl.parentElement.scrollTop = 0;
  }

  resultsEl.addEventListener('click', e => {
    const b = e.target.closest('.addbtn');
    if (!b || b.classList.contains('added')) return;
    addStat(b.dataset.pid, parseInt(b.dataset.idx, 10));
    b.classList.add('added'); b.textContent = '✓';
  });

  /* ================= 右下：统计列表 ================= */
  let stats = [];
  try { stats = JSON.parse(localStorage.getItem('gq_stats') || '[]'); } catch (e) { stats = []; }
  stats = stats.filter(s => pagesById[s.pid] && pagesById[s.pid].items[s.idx]);

  function saveStats() { localStorage.setItem('gq_stats', JSON.stringify(stats)); }

  function addStat(pid, idx) {
    if (stats.some(s => s.pid === pid && s.idx === idx)) return;
    const p = pagesById[pid];
    const dcs = dayCols(p);
    // 默认选第一个有数值的工期列
    let sel = dcs.length ? dcs[0] : -1;
    for (const c of dcs) {
      const v = parseFloat(p.items[idx][c]);
      if (!isNaN(v)) { sel = c; break; }
    }
    stats.push({ pid, idx, sel });
    saveStats(); renderStats();
  }

  function paramSummary(p, it) {
    const dcs = dayCols(p);
    const parts = [];
    p.headers.forEach((h, i) => {
      if (i === 0 || dcs.includes(i) || h === '备注') return;
      if (it[i] && it[i] !== '—') parts.push(h + '：' + it[i]);
    });
    return parts.join('；');
  }

  /* 统计列表「规格/参数」列显示用：标题加粗 */
  function paramSummaryHtml(p, it) {
    const dcs = dayCols(p);
    const parts = [];
    p.headers.forEach((h, i) => {
      if (i === 0 || dcs.includes(i) || h === '备注') return;
      if (it[i] && it[i] !== '—') parts.push(`<b>${esc(h)}</b>：${esc(it[i])}`);
    });
    return parts.join('；');
  }

  function renderStats() {
    const body = $('#statsBody');
    if (!stats.length) {
      body.innerHTML = '<div class="empty" style="padding:20px">暂无统计条目——在上方查询结果中点击 <b style="color:#0b7a3b">＋</b> 添加</div>';
      $('#stInfo').textContent = '';
      $('#totalDays').textContent = '0';
      return;
    }
    let h = `<table class="st"><thead><tr><th style="width:70px">编号</th><th>定额项目</th><th>规格/参数</th><th style="width:150px">类别选择</th><th style="width:70px">工期(天)</th><th style="width:48px;white-space:nowrap">删除</th></tr></thead><tbody>`;
    let total = 0;
    stats.forEach((s, si) => {
      const p = pagesById[s.pid];
      const it = p.items[s.idx];
      const dcs = dayCols(p);
      const val = s.sel >= 0 ? parseFloat(it[s.sel]) : NaN;
      if (!isNaN(val)) total += val;
      let selHtml = '<span style="color:#999">—</span>';
      if (dcs.length) {
        selHtml = `<select data-si="${si}">`;
        dcs.forEach(c => {
          selHtml += `<option value="${c}"${c === s.sel ? ' selected' : ''}>${esc(p.headers[c])}（${esc(it[c])}）</option>`;
        });
        selHtml += '</select>';
      }
      h += `<tr>
        <td class="code">${esc(it[0])}</td>
        <td style="text-align:left">${esc(p.title)}<span style="color:#9aa6b5;font-size:11px">｜${esc(p.path.slice(0,-1).join(' › ').replace(/\s+/g,' '))}</span></td>
        <td style="text-align:left">${paramSummaryHtml(p, it)}</td>
        <td>${selHtml}</td>
        <td class="days">${isNaN(val) ? esc(it[s.sel] || '—') : val}</td>
        <td><button class="st-del" data-si="${si}" title="移除">✕</button></td>
      </tr>`;
    });
    h += '</tbody></table>';
    body.innerHTML = h;
    $('#stInfo').textContent = stats.length + ' 条';
    $('#totalDays').textContent = total;
  }

  $('#statsBody').addEventListener('change', e => {
    const sel = e.target.closest('select[data-si]');
    if (!sel) return;
    stats[parseInt(sel.dataset.si, 10)].sel = parseInt(sel.value, 10);
    saveStats(); renderStats();
  });
  $('#statsBody').addEventListener('click', e => {
    const del = e.target.closest('.st-del');
    if (!del) return;
    stats.splice(parseInt(del.dataset.si, 10), 1);
    saveStats(); renderStats();
    // 同步刷新结果区按钮状态
    resultsEl.querySelectorAll('.addbtn.added').forEach(b => {
      if (!stats.some(s => s.pid === b.dataset.pid && s.idx === parseInt(b.dataset.idx, 10))) {
        b.classList.remove('added'); b.textContent = '＋';
      }
    });
  });
  $('#btnClear').onclick = () => {
    if (!stats.length) return;
    if (!confirm('确定清空统计列表？')) return;
    stats = []; saveStats(); renderStats();
    resultsEl.querySelectorAll('.addbtn.added').forEach(b => { b.classList.remove('added'); b.textContent = '＋'; });
  };
  $('#btnCsv').onclick = () => {
    if (!stats.length) return;
    const rows = [['编号', '定额项目', '所属部分', '规格/参数', '类别', '工期(天)']];
    let total = 0;
    stats.forEach(s => {
      const p = pagesById[s.pid]; const it = p.items[s.idx];
      const val = s.sel >= 0 ? it[s.sel] : '';
      const n = parseFloat(val); if (!isNaN(n)) total += n;
      rows.push([it[0], p.title, p.path[0], paramSummary(p, it), s.sel >= 0 ? p.headers[s.sel] : '', val]);
    });
    rows.push(['', '', '', '', '合计', String(total)]);
    const csv = '\ufeff' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = '工期定额统计列表.csv';
    a.click();
  };

  renderStats();
})();
</script>

<nav class="mtabs" id="mtabs">
  <button data-mv="tree" class="active"><span class="ico">📚</span><span>目录</span></button>
  <button data-mv="search"><span class="ico">🔍</span><span>查询</span></button>
  <button data-mv="stats"><span class="ico">🧮</span><span>统计</span></button>
  <button data-mv="notes"><span class="ico">📄</span><span>说明</span></button>
</nav>
<script>
(function(){
  var app=document.querySelector('.app');
  var tabs=document.getElementById('mtabs');
  if(!tabs||!app) return;
  function activate(mv){
    app.className='app m-'+mv;
    tabs.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-mv')===mv);
    });
  }
  window.__mActivate=activate;
  tabs.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    activate(b.getAttribute('data-mv'));
  });
  /* 选中定额列表的非目录（叶子）项目 → 自动切到查询栏目 */
  var treeEl=document.getElementById('tree');
  if(treeEl){
    treeEl.addEventListener('click',function(e){
      if(e.target.closest('.leaf')){ activate('search'); }
    });
  }
  activate('tree');
})();
</script>
</body>
</html>
